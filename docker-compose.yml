services:
  mysql:
    image: mysql:8.0.21
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - ./data/mysql:/var/lib/mysql
    networks:
      - dooest
    restart: always

  redis:
    image: redis:6.0.8
    container_name: redis
    networks:
      - dooest
    restart: always

  web:
    build: ${APP_SOURCE_DIR:-.}
    image: myweb:latest
    container_name: myweb
    command: gunicorn -w 1 -b 0.0.0.0:5000 app:app --log-level=info --log-file=/dev/stdout
    working_dir: /app
    env_file:
      - .env
    volumes:
      - ./logs:/logs
      - ${APP_SOURCE_DIR:-.}/config.py:/app/config.py
      - ${APP_SOURCE_DIR:-.}/worker/user.py:/app/worker/user.py
      - ${APP_SOURCE_DIR:-.}/static/site:/static/site
    networks:
      - dooest
    depends_on:
      - mysql
      - redis
    restart: always

  index_rss:
    image: myweb:latest
    container_name: index_rss
    command: python task/new_index_rss.py
    working_dir: /app
    env_file:
      - .env
    volumes:
      - ./logs:/logs
      - ${APP_SOURCE_DIR:-.}/config.py:/app/config.py
    networks:
      - dooest
    depends_on:
      - web
    restart: always

  download_icon:
    image: myweb:latest
    container_name: download_icon
    command: python -u task/download_icon_redis_job.py
    working_dir: /app
    env_file:
      - .env
    volumes:
      - ./logs:/logs
      - ${APP_SOURCE_DIR:-.}/config.py:/app/config.py
      - ${APP_SOURCE_DIR:-.}/task/download_icon_redis_job.py:/app/task/download_icon_redis_job.py
      - ${APP_SOURCE_DIR:-.}/static/site:/static/site
    networks:
      - dooest
    depends_on:
      - web
      - redis
      - mysql
    restart: always

  bookmark_ai:
    image: myweb:latest
    container_name: bookmark_ai
    command: python -u task/bookmark_ai_job.py
    working_dir: /app
    env_file:
      - .env
    volumes:
      - ./logs:/logs
      - ${APP_SOURCE_DIR:-.}/config.py:/app/config.py
    networks:
      - dooest
    depends_on:
      - web
      - redis
      - mysql
    restart: always

  nginx:
    image: nginx:stable
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/cloudflare:/cloudflare
      - ${APP_SOURCE_DIR:-.}/static:/static/myweb100/static
    networks:
      - dooest
    depends_on:
      - web
    restart: always

networks:
  dooest:
    driver: bridge
