server {
  listen 80;
  server_name dooest.com www.dooest.com;
  return 301 https://dooest.com$request_uri;
}

server {
  listen  443 ssl;
  ssl_certificate     /cloudflare/dooest.com.pem;
  ssl_certificate_key  /cloudflare/dooest.com.key;
  ssl_protocols         TLSv1.2 TLSv1.3;
  ssl_ciphers           HIGH:!aNULL:!MD5;
  server_name           dooest.com www.dooest.com;

  client_max_body_size 100M;

  location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Origin http://$Host;
        proxy_pass http://myweb:5000;
  }

  location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|woff|woff2|ttf|otf|eot|svg|svgz|mp4|webm|ogg|json)$ {
    root /static/myweb100/static;
    expires 6M;
    add_header Cache-Control "public";
    access_log off;
    try_files $uri =404;
  }
}
